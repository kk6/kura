[package]
name = "kura"
version = "0.2.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
libc = "0.2.191"
log = "0.4.35"
rusqlite = { version = "0.41", features = ["bundled", "backup"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-log = "2.10.1"
unicode-normalization = "0.1.26"

[dev-dependencies]
tauri = { version = "2", features = ["protocol-asset", "test"] }
tempfile = "3.27.0"
