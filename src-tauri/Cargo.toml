[package]
name = "kura"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
libc = "0.2.191"
log = "0.4.35"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-log = "2.10.1"
unicode-normalization = "0.1.26"

[dev-dependencies]
tempfile = "3.27.0"
