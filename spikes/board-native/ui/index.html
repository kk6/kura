<title>タスク0 人工データ</title>
<h1>タスク0 人工データ</h1>
<p>本体とは独立した使い捨て実証。画像と保存内容は人工データ。</p>
<p id="status">準備中</p>
<div class="controls">
<button data-action="edit">人工配置を編集</button>
<button data-action="failure">保存失敗 ON/OFF</button>
<button data-action="top">最前面 ON/OFF</button>
<button data-action="30">不透明度30%</button>
<button data-action="65">不透明度65%</button>
<button data-action="100">100%に戻す</button>
<button data-action="open">ボードを開く</button>
<button data-action="off">OFF・保存して閉じる</button>
</div>
<p>赤い閉じるボタン・⌘W・⌘Qで保存待ち。保存は3秒遅延。</p>
