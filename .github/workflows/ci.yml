name: CI

on:
  push:
  pull_request:

# 同じブランチに続けて push したら、古い実行を取り消して macOS の同時実行の枠（5つ）を空ける。
# main では取り消さない。paths-filter が直前の push との差分しか見ないので、取り消すと検査が漏れる。
# 同じグループでは待っている実行も新しい実行に置き換えられるので、main は実行ごとに別のグループにする
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read # paths-filter が pull_request で変更ファイルを読む

jobs:
  # 変わったファイルで e2e・Rust・Python を流すか決める。lint と Vitest はいつも流す
  changes:
    # 検査はしない振り分けだけのジョブなので、起動の速い ubuntu で動かす
    runs-on: ubuntu-latest
    outputs:
      e2e: ${{ steps.filter.outputs.e2e }}
      rust: ${{ steps.filter.outputs.rust }}
      python: ${{ steps.filter.outputs.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # e2e と rust は「除外リスト以外が1つでも変われば流す」。知らないファイルが増えても流れる側に倒れる
          predicate-quantifier: every
          filters: |
            e2e:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!scripts/**'
              - '!spikes/**'
              - '!homepage/**'
              - '!ml/**'
              - '!src-tauri/**'
              - '!.claude/**'
              - '!ruff.toml'
              - '!lefthook.yml'
              - '!.git-blame-ignore-revs'
              - '!.github/workflows/pages.yml'
            rust:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!scripts/**'
              - '!spikes/**'
              - '!homepage/**'
              - '!ml/**'
              - '!e2e/**'
              - '!src/**'
              - '!.claude/**'
              - '!ruff.toml'
              - '!lefthook.yml'
              - '!.git-blame-ignore-revs'
              - '!eslint.config.js'
              - '!playwright.config.ts'
              - '!.prettierrc.json'
              - '!.prettierignore'
              - '!.github/workflows/pages.yml'
            # predicate-quantifier: every はここにもかかるので、どれか1つに当たればよい条件は1つのパターンにまとめる
            python:
              - '{**/*.py,**/pyproject.toml,**/uv.lock,ruff.toml,.github/workflows/ci.yml}'

  # lint は docs、CLAUDE.md、main.rs のコマンド名も調べるので、どの変更でも流す
  # OS に左右されない検査なので、macOS の同時実行の枠（5つ）を使わない ubuntu で流す
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # キャッシュに当たったときは何もしないで終わる
      - run: npx playwright install webkit
      - run: npm run test:e2e

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # tauri::generate_context! はビルド時に dist/ を読むので、先に画面をビルドする
      - run: npm run build
      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --check
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy -- -D warnings
      - name: cargo test
        working-directory: src-tauri
        run: cargo test

  # OS に左右されない検査なので ubuntu で流す
  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --with pillow --with pytest pytest scripts/
      - run: uvx ruff@0.17.3 check
      - run: uvx ruff@0.17.3 format --check
